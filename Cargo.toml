[workspace]
members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Kazuyuki SUZUKI"]
repository = "https://github.com/kechol/heal"
homepage = "https://github.com/kechol/heal"
rust-version = "1.90"
keywords = ["code-quality", "metrics", "complexity", "claude", "harness"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
include_dir = "0.7"
tempfile = "3"
rustix = { version = "1.1", features = ["fs"] }
tokei = { version = "15", default-features = false }
tree-sitter = "0.27"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-scala = "0.26"
tree-sitter-rust = "0.24"
ignore = "0.4"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# HTTP client for the opt-in `[features.semantic]` family. Only
# `heal semantic ask` and `heal auth jev status` open connections.
# `rustls-no-provider` keeps webpki-roots out: trust roots come from
# the OS store via rustls-native-certs, so corporate CAs keep working.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
